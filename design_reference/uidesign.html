<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Screen Container - 320x240</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- SCREEN 1: MAIN MENU -->
  <div class="screen">
    <div class="header">
      <span>9:30</span>
      <span>100% ☢︎</span>
    </div>
    <div class="wallpaper"></div>
    <div class="menu-list">
      <div class="menu-item" id="songs">Songs</div>
      <div class="menu-item" id="playlists">Playlists</div>
      <div class="menu-item selected" id="artists">
        Artists
        <span class="arrow">&lt;</span>
      </div>
      <div class="menu-item" id="albums">Albums</div>
      <div class="menu-item" id="pong">Pong</div>
      <div class="menu-item" id="devices">Devices</div>
      <div class="menu-item" id="settings">Settings</div>
    </div>
  </div> 

<!-- SCREEN 2: SONGS LIST -->
<div class="screen">
  <div class="header">
    <span>9:30</span>
    <span>100% ☢︎</span>
  </div>
<div class="wallpaper"></div>
<div class="song-list">
  <div class="song-item" id="song1">Song 1</div>
  <div class="song-item selected" id="song2">Song 2<span class="arrow">&lt;</span></div>
  <div class="song-item" id="song3">Song 3</div>
</div>
<div class="song-preview">
  <div class="preview-art"></div>
  <div class="preview-title">Song 2</div>
  <div class="preview-artist">Artist 2</div>
</div>
</div>

<!-- SCREEN 3: SONG SCREEN -->
<div class="screen">
  <div class="header">
    <span>9:30</span>
    <span>100% ☢︎</span>
  </div>
  <div class="song-screen-bg"></div>
  <div class="song-screen-albumcover"><img src="https://i.pinimg.com/736x/65/ec/a3/65eca3c78feb7632d3f5242dfee272c6.jpg" alt="album cover"></div>
  <div class="song-info">
    <div class="song-title">Song 2</div>
    <div class="song-artist"> Artist 2 </div>
  </div>
  <div class="playback"> 
    <div class="time"> 
      <span>0:42</span>
      <span>3:18</span> 
    </div> 
    <div class="progress-bar"> 
      <div class="progress-fill"></div> 
      <div class="progress-knob"></div> 
    </div>
    </div>
  </div>
</div>

</body>
</html>
