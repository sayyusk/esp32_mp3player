<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESP32 Screen Container - 320x240</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #444;
    display: flex;
    padding: 40px;
  }
  /* HEADER */
  .header {
    position: absolute;
    top: 0; left:0;
    width: 320px;
    height: 18px;
  }

  /* ---- THE ACTUAL 320x240 SCREEN CONTAINER ---- */
  .screen {
    position: relative;
    width: 320px;
    height: 240px;
    background: #000;
    color: #fff;
    overflow: hidden;
    outline: 2px solid #0f0; /* just marks the real screen edge, doesn't render on device */
  }

  /* Example of how to place something inside — delete this once you start */
  .example {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100px;
    height: 20px;
  }
</style>
</head>
<body>
  <!-- MAIN MENU-->
  <div class="screen">
    <div class="header">

    </div>
  </div>

</body>
</html>
