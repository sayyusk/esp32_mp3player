<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Screen Container - 320x240</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- MAIN MENU -->
  <div class="screen">
    <div class="header">
      <span>9:30</span>
      <span>100% ☢︎</span>
    </div>
    <div class="wallpaper"></div>
    <div class="menu-list">
      <div class="menu-item" id="songs">Songs</div>
      <div class="menu-item" id="playlists">Playlists</div>
      <div class="menu-item selected" id="artists">
        Artists
        <span class="arrow">&lt;</span>
      </div>
      <div class="menu-item" id="albums">Albums</div>
      <div class="menu-item" id="pong">Pong</div>
      <div class="menu-item" id="devices">Devices</div>
      <div class="menu-item" id="settings">Settings</div>
    </div>
  </div> 

  <!-- SONGS LIST -->

  <div class="side-panel"></div>
</body>
</html>
